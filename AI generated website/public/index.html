<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant System Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6 font-sans text-gray-800">

    <div class="max-w-2xl w-full text-center">
        <header class="mb-10">
            <h1 class="text-5xl font-bold text-gray-900 mb-4">AZ-Food System</h1>
            <p class="text-lg text-gray-500">Select your terminal to continue</p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <!-- Waitress Link -->
            <a href="/waitress.html" class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 hover:shadow-lg hover:border-blue-300 transition-all group block">
                <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl group-hover:scale-110 transition-transform">
                    📝
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Waitress Terminal</h2>
                <p class="text-gray-500 text-sm">Take orders and send tickets to the kitchen.</p>
            </a>

            <!-- Kitchen Link -->
            <a href="/kitchen.html" class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 hover:shadow-lg hover:border-green-300 transition-all group block">
                <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl group-hover:scale-110 transition-transform">
                    👨‍🍳
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Kitchen Display</h2>
                <p class="text-gray-500 text-sm">View active tickets and mark orders as served.</p>
            </a>
        </div>
    </div>

</body>
</html>
